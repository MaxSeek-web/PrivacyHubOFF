<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrivacyHub — Технические работы</title>
<style>
:root {
  --bg: #0B0C10;
  --surface: #161B22;
  --text-primary: #E6EDF3;
  --text-secondary: #8B949E;
  --accent: #58A6FF;
  --border: #30363D;
}
.light-theme {
  --bg: #FFFFFF;
  --surface: #F6F8FA;
  --text-primary: #1F2328;
  --text-secondary: #656D76;
  --accent: #0969DA;
  --border: #D0D7DE;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 48px 40px;
  text-align: center;
  max-width: 440px;
  width: 100%;
  animation: fadeIn 0.6s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.icon {
  font-size: 4rem;
  margin-bottom: 20px;
  display: block;
}
h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 12px;
}
p {
  color: var(--text-secondary);
  font-size: 1rem;
  line-height: 1.6;
  margin-bottom: 24px;
}
.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(248, 81, 73, 0.15);
  color: #F85149;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 600;
  margin-bottom: 24px;
}
.status-dot {
  width: 10px;
  height: 10px;
  background: #F85149;
  border-radius: 50%;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #fff;
  text-decoration: none;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.footer {
  margin-top: 32px;
  font-size: 0.8rem;
  color: var(--text-secondary);
}
</style>
</head>
<body>
<div class="card">
  <span class="icon">🔧</span>
  <h1>Технические работы</h1>
  <div class="status">
    <span class="status-dot"></span>
    <span>Сервер временно недоступен</span>
  </div>
  <p>Сайт PrivacyHub находится на обслуживании.<br>Попробуйте обновить страницу через несколько минут.</p>
  <button class="btn" onclick="location.reload()">🔄 Обновить страницу</button>
  <div class="footer">PrivacyHub Web © 2026</div>
</div>
</body>
</html>
